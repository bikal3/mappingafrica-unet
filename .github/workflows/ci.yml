name: CI

# main is covered by deploy.yml, which runs the same checks before publishing.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: demo/frontend
        run: npm ci

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Lint
        working-directory: demo/frontend
        run: npm run lint

      # Runs against the checkout, so a source file missing from the repo
      # fails here rather than during a deploy.
      - name: Build
        working-directory: demo/frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Check displayed figures against the shipped images
        run: python demo/check_consistency.py
